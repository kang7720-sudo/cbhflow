name: Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild -project Zeroflow.xcodeproj -scheme Zeroflow -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build

      - name: Package DMG
        run: |
          APP=$(find build/Build -name "Zeroflow.app" | head -n 1)
          mkdir -p dist
          cp -R -L "$APP" dist/
          hdiutil create -volname "Zeroflow" -srcfolder dist -ov -format UDZO "Zeroflow-${GITHUB_REF_NAME}.dmg"

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: Zeroflow-*.dmg
